<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Buzz! Controller</title>
    <style>
        body {
            margin: 0; background: #000; font-family: 'Arial Black', sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            touch-action: none; -webkit-user-select: none; user-select: none;
            align-items: center; justify-content: center;
        }
        
        /* Connection Setup Screen */
        #connection-screen {
            position: fixed; inset: 0; background: #1a1a1a; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10;
        }
        input { padding: 15px; margin: 10px; font-size: 18px; border-radius: 8px; border: 2px solid #444; background: #333; color: white; text-align: center; }
        #connect-btn { background: #007bff; color: white; font-weight: bold; padding: 15px 30px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer;}
        
        /* Realistic Controller Body */
        #controller-screen { 
            display: none; flex-direction: column; 
            height: 98vh; width: 90vw; max-width: 400px;
            background: #1c1c1e; border-radius: 50px; 
            padding: 20px; box-sizing: border-box;
            border: 4px solid #111; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative; align-items: center;
        }

        #player-tag { 
            position: absolute; top: 15px; left: 25px; color: #8e8e93; font-size: 14px; letter-spacing: 1px;
        }

        /* Giant Round Red Buzz Button */
        .buzz-container {
            flex: 2; width: 100%; display: flex; justify-content: center; align-items: center; margin-top: 20px;
        }
        .buzz-dome {
            width: 150px; height: 150px; background: radial-gradient(circle at 50% 30%, #ff453a, #b30000);
            border-radius: 50%; border: 6px solid #111;
            box-shadow: 0 10px 15px rgba(0,0,0,0.5), inset 0 4px 10px rgba(255,255,255,0.4);
            display: flex; justify-content: center; align-items: center;
            color: #700000; font-size: 24px; font-weight: 900; letter-spacing: 1px;
        }
        .buzz-dome:active {
            background: radial-gradient(circle at 50% 30%, #ff1a0a, #800000);
            transform: scale(0.97); box-shadow: 0 4px 5px rgba(0,0,0,0.5);
        }

        /* Rectangular Colored Buttons Layout */
        .color-buttons-container {
            flex: 3; width: 100%; display: flex; flex-direction: column; 
            justify-content: space-evenly; align-items: center; margin-bottom: 20px;
        }
        .rect-btn {
            width: 85%; height: 14%; border-radius: 15px; border: 5px solid #111;
            box-shadow: 0 5px 5px rgba(0,0,0,0.3), inset 0 3px 5px rgba(255,255,255,0.3);
            transition: transform 0.05s;
        }
        .rect-btn:active { transform: scale(0.96); filter: brightness(0.8); }

        /* Exact colors matched to your image sequence (Top to Bottom) */
        .blue   { background: linear-gradient(#0a84ff, #0040aa); }
        .orange { background: linear-gradient(#ff9f0a, #b36b00); }
        .green  { background: linear-gradient(#30d158, #1a7a33); }
        .yellow { background: linear-gradient(#ffd60a, #b39500); }

    </style>
</head>
<body>

    <div id="connection-screen">
        <h2 style="margin-bottom:5px;">Buzz! Wireless Link</h2>
        <p style="color:#8e8e93; margin-top:0;">Enter your PC's IP Address</p>
        <input type="text" id="ip-input" placeholder="192.168.1.X" value="">
        <button id="connect-btn" onclick="connectToServer()">Connect Controller</button>
    </div>

    <div id="controller-screen">
        <div id="player-tag">DISCONNECTED</div>
        
        <div class="buzz-container">
            <div class="btn buzz-dome" data-id="0">BUZZ</div>
        </div>
        
        <div class="color-buttons-container">
            <div class="btn rect-btn blue" data-id="1"></div>
            <div class="btn rect-btn orange" data-id="2"></div>
            <div class="btn rect-btn green" data-id="3"></div>
            <div class="btn rect-btn yellow" data-id="4"></div>
        </div>
    </div>

    <script>
        let ws;
        const connScreen = document.getElementById('connection-screen');
        const ctrlScreen = document.getElementById('controller-screen');
        const playerTag = document.getElementById('player-tag');

        function connectToServer() {
            const ip = document.getElementById('ip-input').value.trim();
            if(!ip) { alert("Please enter an IP address"); return; }

            // Attemp network connection
            ws = new WebSocket(`ws://${ip}:8765`);

            ws.onopen = () => {
                // FIXED capitalization to JSON
                ws.send(JSON.stringify({ type: "register" }));
            };

            ws.onmessage = (event) => {
                // FIXED capitalization to JSON
                const msg = JSON.parse(event.data);
                if(msg.status === "success") {
                    connScreen.style.display = "none";
                    ctrlScreen.style.display = "flex";
                    playerTag.innerText = "PLAYER 0" + msg.player_id;
                } else {
                    alert("Lobby Full or Server Error: " + msg.message);
                }
            };

            ws.onclose = () => {
                connScreen.style.display = "flex";
                ctrlScreen.style.display = "none";
                playerTag.innerText = "DISCONNECTED";
                alert("Lost connection to the PC Python Server.");
            };

            ws.onerror = () => {
                alert("Could not reach Python server. Check your IP address and ensure the Python script is running on your PC.");
            };
        }

        // Optimized Touch Handling for Mobile Browsers
        document.querySelectorAll('.btn').forEach(button => {
            const sendInput = (action) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "input",
                        button: parseInt(button.dataset.id),
                        action: action
                    }));
                }
            };

            // Using touch events avoids the 300ms click delay on mobile browsers
            button.addEventListener('touchstart', (e) => { e.preventDefault(); sendInput('press'); });
            button.addEventListener('touchend', (e) => { e.preventDefault(); sendInput('release'); });
        });
    </script>
</body>
</html>
