<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Buzz! Controller Local Pro</title>
    <style>
        body {
            margin: 0; background: #000; font-family: 'Arial Black', sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            touch-action: none; -webkit-user-select: none; user-select: none;
            align-items: center; justify-content: center;
        }
        
        #connection-screen {
            position: fixed; inset: 0; background: #1a1a1a; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10;
        }
        input, select { padding: 15px; margin: 8px; font-size: 16px; border-radius: 8px; border: 2px solid #444; background: #333; color: white; text-align: center; width: 240px;}
        input { text-transform: uppercase; font-weight: bold; letter-spacing: 2px; }
        #connect-btn { background: #0a84ff; color: white; font-weight: bold; padding: 15px 30px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer; margin-top: 15px; width: 240px;}
        
        #controller-screen { 
            display: none; flex-direction: column; 
            height: 98vh; width: 92vw; max-width: 420px;
            background: #1c1c1e; border-radius: 50px; 
            padding: 20px; box-sizing: border-box;
            border: 4px solid #111; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative; align-items: center;
        }

        #player-tag { position: absolute; top: 15px; left: 25px; color: #8e8e93; font-size: 14px; letter-spacing: 1px; }

        .buzz-container { flex: 3; width: 100%; display: flex; justify-content: center; align-items: center; margin-top: 30px; }
        
        .buzz-dome {
            width: 250px; height: 250px; background: radial-gradient(circle at 50% 30%, #ff453a, #b30000);
            border-radius: 50%; border: 6px solid #111;
            box-shadow: 0 12px 18px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.4);
            display: flex; justify-content: center; align-items: center;
            color: #700000; font-size: 32px; font-weight: 900; letter-spacing: 2px;
        }
        .buzz-dome:active { background: radial-gradient(circle at 50% 30%, #ff1a0a, #800000); transform: scale(0.96); box-shadow: 0 4px 5px rgba(0,0,0,0.5); }

        .color-buttons-container { flex: 4; width: 100%; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; margin-bottom: 40px; }
        .rect-btn { width: 88%; height: 18%; border-radius: 15px; border: 5px solid #111; box-shadow: 0 5px 5px rgba(0,0,0,0.3), inset 0 3px 5px rgba(255,255,255,0.3); box-sizing: border-box; }
        .rect-btn:active { transform: scale(0.96); filter: brightness(0.8); }

        .blue   { background: linear-gradient(#0a84ff, #0040aa); }
        .orange { background: linear-gradient(#ff6600, #cc3300); } 
        .green  { background: linear-gradient(#30d158, #1a7a33); }
        .yellow { background: linear-gradient(#ffd60a, #b39500); }
    </style>
</head>
<body>

    <div id="connection-screen">
        <h2 style="margin-bottom:5px;">Buzz! Wireless Link</h2>
        <p style="color:#8e8e93; margin-top:0;">Enter Password / Code to Join</p>
        
        <input type="text" id="code-input" placeholder="ENTER CODE">
        
        <select id="player-select">
            <option value="1">Player 1</option>
            <option value="2">Player 2</option>
            <option value="3">Player 3</option>
            <option value="4">Player 4</option>
        </select>
        
        <button id="connect-btn" onclick="connectToServer()">Join Game</button>
    </div>

    <div id="controller-screen">
        <div id="player-tag">DISCONNECTED</div>
        <div class="buzz-container"><div class="btn buzz-dome" data-id="0">BUZZ</div></div>
        <div class="color-buttons-container">
            <div class="btn rect-btn blue" data-id="1"></div>
            <div class="btn rect-btn orange" data-id="2"></div>
            <div class="btn rect-btn green" data-id="3"></div>
            <div class="btn rect-btn yellow" data-id="4"></div>
        </div>
    </div>

    <script>
        let ws;
        let wakeLock = null;
        const connScreen = document.getElementById('connection-screen');
        const ctrlScreen = document.getElementById('controller-screen');
        const playerTag = document.getElementById('player-tag');

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
            } catch (err) { console.log("WakeLock inactive:", err.message); }
        }

        function decodeRoomCode(code) {
            code = code.trim().toUpperCase();
            if (!code) return null;
            
            // Decodes the base36 string password back into a large integer
            let num = 0;
            const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let i = 0; i < code.length; i++) {
                const current_char = code[i];
                const val = chars.indexOf(current_char);
                if (val === -1) return null; // Invalid character found
                num = (num * 36) + val;
            }
            
            // Unpack the large integer back into the standard 4-part IP syntax
            const oct1 = (num >>> 24) & 255;
            const oct2 = (num >>> 16) & 255;
            const oct3 = (num >>> 8) & 255;
            const oct4 = num & 255;
            
            return `${oct1}.${oct2}.${oct3}.${oct4}`;
        }

        function connectToServer() {
            const codeInput = document.getElementById('code-input').value;
            const selectedPlayer = document.getElementById('player-select').value;
            
            const targetIp = decodeRoomCode(codeInput);
            if (!targetIp) {
                alert("Invalid room code format.");
                return;
            }

            ws = new WebSocket(`ws://${targetIp}:8765`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: "register", requested_player: parseInt(selectedPlayer) }));
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.status === "success") {
                    connScreen.style.display = "none";
                    ctrlScreen.style.display = "flex";
                    playerTag.innerText = "PLAYER 0" + msg.player_id;
                    requestWakeLock(); 
                } else {
                    alert("Error: " + msg.message);
                }
            };

            ws.onclose = () => {
                connScreen.style.display = "flex";
                ctrlScreen.style.display = "none";
                playerTag.innerText = "DISCONNECTED";
                if(wakeLock !== null) { wakeLock.release(); wakeLock = null; }
            };
            
            ws.onerror = () => {
                alert("Connection failed. Make sure your phone is connected to the same Wi-Fi network as your PC.");
            };
        }

        document.querySelectorAll('.btn').forEach(button => {
            const sendInput = (action) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "input", button: parseInt(button.dataset.id), action: action }));
                }
            };
            button.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                if ('vibrate' in navigator) { navigator.vibrate(30); }
                sendInput('press'); 
            });
            button.addEventListener('touchend', (e) => { 
                e.preventDefault(); 
                sendInput('release'); 
            });
        });
    </script>
</body>
</html>
